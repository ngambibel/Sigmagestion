# Nginx — sert la PWA (statique) et proxyfie l'API vers Gunicorn.
# À adapter : server_name et chemins des certificats Let's Encrypt.

upstream sigma_web {
    server web:8000;
}

# Redirection HTTP → HTTPS (+ challenge ACME)
server {
    listen 80;
    server_name sigmagestion.duckdns.org;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name sigmagestion.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/sigmagestion.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sigmagestion.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 10M;  # justificatifs de dépense (photos)

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # En-têtes de sécurité (cible securityheaders.com ≥ A)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # API, admin et statiques Django (servis par WhiteNoise côté Gunicorn)
    location ~ ^/(api|admin|static)/ {
        proxy_pass http://sigma_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;  # lu par SECURE_PROXY_SSL_HEADER
        proxy_read_timeout 30s;
    }

    # Médias (uploads) servis directement
    location /media/ { alias /app/media/; expires 7d; }

    # Le service worker ne doit jamais être mis en cache par le navigateur
    location = /sw.js { root /usr/share/nginx/html; add_header Cache-Control "no-cache"; }

    # PWA : fichiers hachés en cache long, sinon repli SPA sur index.html
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
